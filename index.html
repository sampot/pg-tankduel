<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="戰車對決：俯視坦克對戰、炮塔瞄準、爆炸特效。純前端 Playgrounds SAM，適配手機與桌面、自製音效。"
    />
    <title>戰車對決</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">街機</p>
        <h1>戰車對決</h1>
        <p class="tagline">履帶炮塔 · 掩體彈道 · 純娛樂</p>
      </header>

      <section class="meter" aria-label="對局狀態">
        <div class="meter-item">
          <span class="label">分數</span>
          <strong id="score">0</strong>
        </div>
        <div class="meter-item">
          <span class="label" id="hp-you-label">綠方 HP</span>
          <strong id="hp-you">5</strong>
        </div>
        <div class="meter-item">
          <span class="label" id="hp-enemy-label">紅方 HP</span>
          <strong id="hp-enemy">5</strong>
        </div>
        <div class="meter-actions">
          <button type="button" id="btn-mute" class="secondary" aria-pressed="true">音效開</button>
        </div>
      </section>

      <div class="mode-row" role="group" aria-label="對戰模式">
        <button type="button" class="mode-btn is-active" data-mode="pve" id="mode-pve">人 vs AI</button>
        <button type="button" class="mode-btn" data-mode="aivai" id="mode-aivai">AI vs AI</button>
      </div>

      <div class="controls">
        <button type="button" id="btn-start">開戰</button>
      </div>

      <p id="status" class="status" role="status">選模式後點「開戰」</p>

      <div class="stage">
        <canvas id="game" width="360" height="520" aria-label="戰車對決戰場"></canvas>
        <div class="touch-layer" id="touch-layer">
          <div id="stick-zone" class="stick-zone" aria-label="左側移動搖桿區">
            <span class="stick-zone-label" aria-hidden="true">任意按住移動</span>
            <div id="stick" class="stick" aria-hidden="true">
              <div id="stick-knob" class="stick-knob"></div>
            </div>
          </div>
          <button type="button" id="btn-fire" class="fire-btn" aria-pressed="false">炮</button>
        </div>
      </div>

      <p class="hint" id="hint">左下區域任意按住拖曳 · 右下炮鍵開火（或鍵盤 WASD／方向鍵＋空白鍵）</p>

      <details class="rules">
        <summary>怎麼玩</summary>
        <ul>
          <li><strong>人 vs AI</strong>：你操控綠方，紅方由電腦操作。</li>
          <li><strong>AI vs AI</strong>：雙方皆由電腦對打，可觀戰（綠偏猛攻、紅偏拉距）。</li>
          <li>用掩體卡位，五發命中擊毀對手；炮彈撞牆會引爆。</li>
        </ul>
      </details>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
